name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build Ainotes (ubuntu, x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools imagemagick

      - name: Fetch the vendor release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-sources.sh --version 1.15.0

      - name: Build Ainotes
        run: scripts/build.sh

      - name: Verify packages
        run: |
          ls -la dist/
          dpkg-deb --info dist/ainotes_1.15.0_amd64.deb
          OFFSET=$(python3 scripts/find_squashfs_offset.py dist/Ainotes-1.15.0.AppImage)
          unsquashfs -s -o "$OFFSET" dist/Ainotes-1.15.0.AppImage | head -5

      - name: Verify rebrand
        run: |
          rm -rf verify
          mkdir -p verify
          node_modules/.bin/asar extract ainotes/resources/ainotes.asar verify/payload
          node_modules/.bin/asar extract ainotes/resources/app.asar verify/launcher
          test -f verify/payload/ainotes-theme.css
          test -x ainotes/ainotes
          test -x ainotes/ainotes-cli
          test -f ainotes/resources/ainotes.asar
          python3 scripts/check_brand.py verify/payload verify/launcher
          echo "rebrand verified: no vendor brand token in payload or launcher"

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ainotes-linux-amd64
          path: |
            dist/ainotes_1.15.0_amd64.deb
            dist/Ainotes-1.15.0.AppImage
            dist/ainotes-1.15.0-linux-amd64.tar.gz
          if-no-files-found: error

  windows:
    name: build Ainotes (windows, x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wine64 nsis p7zip-full python3-pip
          python3 -m pip install --upgrade pefile

      - name: Fetch the vendor release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-sources.sh --version 1.15.0

      - name: Build the application payload
        run: scripts/build.sh --skip-package

      - name: Fetch the vendor Windows release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/fetch-windows.sh --version 1.15.0

      - name: Build the Windows distribution
        run: scripts/build-windows.sh

      - name: Verify the rebrand
        run: |
          python3 scripts/check_brand.py build/windows/Ainotes
          test -f build/windows/Ainotes/Ainotes.exe
          test -f build/windows/Ainotes/Ainotes.com
          test -f build/windows/Ainotes/resources/ainotes.asar
          test -f dist/Ainotes-Setup-1.15.0.exe

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        with:
          name: ainotes-windows-amd64
          path: |
            dist/Ainotes-1.15.0-windows-x64.zip
            dist/Ainotes-Setup-1.15.0.exe
          if-no-files-found: error
